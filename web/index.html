<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel Board on Robinhood Chain</title>
    <meta name="description" content="A shared 64×64 pixel canvas on Robinhood Chain. One pixel per transaction, no tokens." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2' shape-rendering='crispEdges'%3E%3Crect width='1' height='1' fill='%23E8343A'/%3E%3Crect x='1' width='1' height='1' fill='%23FFD42A'/%3E%3Crect y='1' width='1' height='1' fill='%232335B8'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%231B1D22'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="title">
          <h1>Pixel Board</h1>
          <p class="lede">A shared 64×64 canvas on Robinhood Chain. Pick a color, click a pixel, sign one transaction.</p>
        </div>
        <div class="top-actions">
          <span class="net" id="net" data-online="true"><span class="dot" aria-hidden="true"></span><span id="net-name"></span></span>
          <button class="account-btn" id="account-btn" type="button" aria-haspopup="menu" aria-expanded="false">
            Connect wallet
          </button>
        </div>
      </header>

      <p class="setup" id="setup" hidden></p>

      <main class="layout" id="app">
        <div class="stage">
          <div class="board-frame">
            <div class="readout" id="readout" aria-hidden="true"></div>
            <div class="ruler ruler-x" aria-hidden="true"></div>
            <div class="ruler ruler-y" aria-hidden="true"></div>
            <div
              class="board"
              id="board"
              tabindex="0"
              role="application"
              aria-label="Pixel board, 64 by 64. Arrow keys move the selection, Shift jumps 8 pixels, Enter paints."
            >
              <canvas></canvas>
              <div class="grid" aria-hidden="true"></div>
              <div class="cell ghost" hidden></div>
              <div class="cell selection" hidden></div>
              <div class="cell pending" hidden></div>
            </div>
          </div>
          <div class="under-board">
            <p class="stats" id="stats">Loading the board…</p>
            <label class="toggle"><input type="checkbox" id="grid-toggle" checked /> Show grid</label>
          </div>
        </div>

        <aside class="panel">
          <section>
            <div class="section-head">
              <h2>Color</h2>
              <span class="color-name" id="color-name"></span>
            </div>
            <div class="palette" id="palette" role="radiogroup" aria-label="Color"></div>
          </section>

          <section>
            <h2>Selected pixel</h2>
            <div class="pixel-info" id="pixel-info"></div>
            <div class="action">
              <button class="paint-btn" id="paint-btn" type="button" disabled>Loading the board…</button>
              <p class="status" id="status" role="status" aria-live="polite"></p>
            </div>
          </section>

          <section>
            <h2>Recent pixels</h2>
            <ol class="feed" id="feed"></ol>
          </section>
        </aside>
      </main>

      <footer class="foot" id="foot"></footer>
    </div>

    <div class="menu" id="menu" role="menu" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
